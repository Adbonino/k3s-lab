apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gitops
  template:
    metadata:
      labels:
        app: nginx-gitops
    spec:
      containers:
      - name: nginx
        image: adbonino/nginx-site:52ffac9662a2073a57e5f79861062c8d4c74937f
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /workdir
      volumes:
      - name: html-volume
        persistentVolumeClaim:
          claimName: nginx-html-pvc  
