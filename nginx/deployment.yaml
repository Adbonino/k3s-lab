apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gitops
  template:
    metadata:
      labels:
        app: nginx-gitops
    spec:
      containers:
      - name: nginx
        image: adbonino/nginx-site:00dbb1805f56ae53a948c8b4f7bf1022976a0445
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /workdir
      volumes:
      - name: html-volume
        persistentVolumeClaim:
          claimName: nginx-html-pvc  
