<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bienvenido</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    .card {
      background: rgba(0,0,0,0.3);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 3em;
      margin: 0;
    }

    p {
      font-size: 1.3em;
      margin-top: 10px;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👋 Bienvenido</h1>
    <p>Servidor Nginx </p>
    <p><strong>Logicalis S.A.</strong></p>

    <div class="footer">
      🚀 Deployado con Argo CD + k3s + CI/CD
    </div>
  </div>

</body>
</html>
