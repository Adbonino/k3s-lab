name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login en Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 3. Set up Docker Buildx (mejor práctica)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build de la imagen
      - name: Build Docker image
        run: |
          docker build \
            -f nginx/Dockerfile \
            -t adbonino/nginx-site:${{ github.sha }} \
            -t adbonino/nginx-site:latest \
            nginx/

      # 5. Push a Docker Hub
      - name: Push Docker image
        run: |
          docker push adbonino/nginx-site:${{ github.sha }}
          docker push adbonino/nginx-site:latest

      # 6. Update deployment.yaml (GitOps automático)
      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image:.*|image: adbonino/nginx-site:${{ github.sha }}|" deployment.yaml

      # 7. Commit y push del cambio al repo
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add deployment.yaml
          git commit -m "ci: update image to ${{ github.sha }}"
          git push
